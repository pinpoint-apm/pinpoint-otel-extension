name: Examples

# The guides in docs/ copy their code blocks from these projects, so they are built on every
# change to keep the two from drifting apart. They need JDK 17 (Spring Boot 3) and are not part
# of the extension's own reactor, which stays on Java 8 bytecode.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'src/test/resources/pp-tracestate-contract.txt'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'src/test/resources/pp-tracestate-contract.txt'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test the plain SDK example
        run: ./mvnw -B --no-transfer-progress -f examples/java/sdk-sample/pom.xml verify

      - name: Build the Spring Boot starter example
        run: ./mvnw -B --no-transfer-progress -f examples/java/spring-boot-sample/pom.xml package -DskipTests

      - name: Check the examples do not depend on the extension or on Pinpoint
        run: |
          ! grep -rl "com.navercorp.pinpoint" examples/java/*/pom.xml
          ! grep -rl "com.navercorp.pinpoint" examples/java/*/src

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/node/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
