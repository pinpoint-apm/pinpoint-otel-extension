name: Python

# Tests and builds the Python sampler package under python/. Publishing is not done here.
on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'src/test/resources/pp-tracestate-contract.txt'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'src/test/resources/pp-tracestate-contract.txt'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        sdk: ['']
        include:
          # the oldest SDK the package declares, on the oldest Python
          - python: '3.9'
            sdk: '==1.14.0'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.sdk }}" ]; then pip install "opentelemetry-sdk${{ matrix.sdk }}" setuptools; fi
          pip install -e ".[test]"
          python -c "import opentelemetry.sdk.version as v; print('opentelemetry-sdk', v.__version__)"

      - name: Test
        working-directory: python
        run: python -m pytest -q

      - name: Check the entry point is registered
        run: |
          python - <<'EOF'
          from importlib.metadata import entry_points
          eps = entry_points()
          group = eps.select(group="opentelemetry_traces_sampler") if hasattr(eps, "select") else eps.get("opentelemetry_traces_sampler", [])
          names = sorted(e.name for e in group)
          print(names)
          assert "pinpoint" in names
          EOF

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check the distribution
        working-directory: python
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pinpoint-otel-sampler
          path: python/dist/*
          if-no-files-found: error
